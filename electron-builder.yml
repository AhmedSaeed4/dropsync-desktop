# PACKAGING-1 STEP 1 — Windows installer config (the FINALE). Exactly what the order locked,
# nothing else: unsigned NSIS one-click per-user (SmartScreen "More info → Run anyway" is the
# documented, accepted trade-off), no publish block, no code signing. The installer is built
# ON WINDOWS from a sibling copy of this tree (dropsync-desktop-build) via npm run dist:win.
appId: com.dropsync.desktop
productName: DropSync Desktop
directories:
  output: dist
files:
  - out/**
  - package.json
win:
  target: NSIS
  icon: build/icon.png
# Round 118 — update feed pointer. With this block dist:win EMITS dist\latest.yml (the
# update "menu": version + file name + sha512 + size) and embeds resources\app-update.yml
# in the build. The build NEVER uploads anything (no --publish, no GH_TOKEN) — releases are
# attached manually at graduation (GIT LAW, planner-only).
publish:
  provider: github
  owner: AhmedSaeed4
  repo: dropsync-desktop
nsis:
  oneClick: true
